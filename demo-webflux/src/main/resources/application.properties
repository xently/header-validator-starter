spring.application.name=demo-webflux
xently.api.headers.validation.headers.[0].header-name=X-Additional-Required
xently.api.headers.validation.headers.[1].header-name=X-Additional-Optional
xently.api.headers.validation.headers.[1].required=false
xently.api.headers.validation.headers.[2].header-name=X-Additional-Custom-Validator
xently.api.headers.validation.headers.[2].required=false
# Spring bean name
xently.api.headers.validation.headers.[2].validator=CustomValidator
# will take precedence over the default header X-TimeStamp
xently.api.headers.validation.headers.[3].header-name=X-Timestamp
xently.api.headers.validation.headers.[3].required=false
xently.api.headers.validation.headers.[3].validator=co.ke.xently.demowebflux.validators.ISO8601TimestampHeaderValidator
xently.api.headers.validation.headers.[4].header-name=X-Custom-Allowed-Values
xently.api.headers.validation.headers.[4].allowed-values=x,y,z
xently.api.headers.validation.headers.[5].header-name=X-Custom-Allowed-Values-Optional
xently.api.headers.validation.headers.[5].required=false
xently.api.headers.validation.headers.[5].allowed-values=x,y,z
